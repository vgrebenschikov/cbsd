# Generic Ubuntu Linuxulator jail. Rootfs is supplied separately; no distribution base is fetched.
jail_profile="ubuntu"

# suggest for ubjail1, ubjail2...
default_jailname="ubjail"
default_domain="my.domain"

emulator="jail"

# this is one-string additional info strings in dialogue menu
long_description="Linuxulator based Ubuntu environment"

# for custom script:
#customskel="${workdir}/share/${platform}-jail-ubuntu-skel"

# for distribution script:
customskel="${CIX_DISTDIR}/share/Linux-jail-ubuntu-skel"

# jails-system skel dir, for custom script:
#jailsysskeldir="${workdir}/share/${platform}-jail-ubuntu-system-skel"

# jails-system skel dir, for distribution script:
jailsysskeldir="${CIX_DISTDIR}/share/Linux-jail-ubuntu-system-skel"

# empty jailskeldir
#jailskeldir="${workdir}/share/${platform}-jail-puppet-skel"
jailskeldir=

jail_active="1"

platform="Linux"
ver="empty"
baserw="1"
applytpl=0

exec_start="/bin/true"
exec_stop="/bin/true"

# autostart asap upon jail created
runasap="0"

# no pkg in linux ubuntu jail
pkg_bootstrap="0"

# jconstruct-tui hide menu
tui_user_root_pw_enable=0
tui_add_user_enable=0
tui_services_enable=0
tui_pkg_bootstrap_enable=0
tui_baserw_enable=0
tui_ver_enable=0
tui_arch_enable=0
tui_pkglist_enable=0

mount_ports="0"
mount_linprocfs="1"
mount_linsysfs="1"
mount_fdescfs="1"
mount_procfs="0"
mount_devfs="0"

etcupdate_init="0"

# inherit global jnameserver settings
jnameserver="0"
